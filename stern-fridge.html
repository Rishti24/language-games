<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Stern Fridge</title>
  <style>
    :root{
      --bg:#000000;
      --fridge-body:#0b1114; /* very dark metal */
      --interior:#071326; /* deep cold blue */
      --glass:rgba(255,255,255,0.04);
      --cold:#9fcff6;
      --muted:#9aa6b0;
      --text:#dfeaf3;
    }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui;}
    .app{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}
    h1{margin:0 0 18px;font-weight:600;color:var(--text);font-size:20px;letter-spacing:0.6px}

    .frame{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;max-width:820px}

    /* Fridge */
    .fridge-wrap{display:flex;gap:18px;align-items:flex-start}
    .fridge{width:560px;border-radius:8px;padding:18px;background:linear-gradient(180deg,var(--fridge-body),#0f1a20);box-shadow:0 20px 60px rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.03);position:relative;overflow:visible}
    .fridge .door-edge{position:absolute;left:-18px;top:12px;width:18px;height:calc(100% - 24px);background:linear-gradient(180deg,#000,#0b1114);border-radius:4px}
    .interior{border-radius:6px;padding:14px;background:linear-gradient(180deg,rgba(15,34,54,0.16),rgba(8,22,34,0.28));min-height:420px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
    .fridge .light{position:absolute;left:50%;transform:translateX(-50%);top:10px;width:60%;height:200px;background:radial-gradient(circle at 50% 10%,rgba(159,207,246,0.12),transparent 40%);filter:blur(12px);transition:opacity .28s ease, filter .28s ease;opacity:.18}
    .fridge.open .light{opacity:0.9;filter:blur(14px)}
    .fridge.lit .light{opacity:1;filter:blur(18px)}

    /* Door overlay for closed-to-open animation */
    .door{position:absolute;top:12px;left:18px;right:18px;bottom:12px;border-radius:6px;background:linear-gradient(180deg,#071218,#08151a);box-shadow:0 18px 40px rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;transition:transform .7s cubic-bezier(.2,.9,.19,1),opacity .4s ease;z-index:8}
    .door .handle{width:72px;height:14px;border-radius:10px;background:linear-gradient(90deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02));border:1px solid rgba(255,255,255,0.03);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
    .fridge.open .door{transform:translateX(-120%);opacity:0}
    .fridge.closed .light{opacity:0.12}

    .shelf{height:92px;display:flex;align-items:center;gap:14px;padding:8px;border-top:1px solid var(--glass);border-bottom:1px solid rgba(255,255,255,0.02)}
    .shelf.top{height:76px}

    /* Food items — minimal, labeled tiles */
    .item{min-width:110px;min-height:60px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,background .18s ease,border-color .12s ease;border:1px solid rgba(255,255,255,0.02)}
    .item:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(2,10,20,0.5)}
    .item .name{font-size:14px;color:var(--text);font-weight:600;letter-spacing:0.6px}
    .item .meta{font-size:12px;color:var(--muted);margin-top:6px}
    .item.selected{outline:2px solid rgba(159,207,246,0.18);background:linear-gradient(180deg,rgba(159,207,246,0.03),rgba(255,255,255,0.01));transform:translateY(-8px)}

    /* Response area */
    .response{width:100%;max-width:360px;background:transparent;border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
    .observation{color:var(--text);font-size:15px;opacity:0;transform:translateY(6px);transition:opacity .26s ease,transform .26s ease;font-weight:600}
    .prediction{color:var(--muted);font-size:13px;opacity:0;transform:translateY(6px);transition:opacity .26s ease .14s,transform .26s ease .14s}
    .response.visible .observation{opacity:1;transform:translateY(0)}
    .response.visible .prediction{opacity:1;transform:translateY(0)}

    /* Small behavior log (discreet) */
    .log{width:120px;background:rgba(255,255,255,0.02);padding:10px;border-radius:6px;border:1px solid rgba(255,255,255,0.02);font-size:12px;color:var(--muted)}
    .log h3{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:600}
    .count{display:flex;justify-content:space-between}

    /* Responsive adjustments */
    @media (max-width:880px){.fridge{width:92vw}.fridge-wrap{flex-direction:column;align-items:center}.response{max-width:92vw}}
  </style>
</head>
<body>
  <div class="app">
    <h1>The Stern Fridge</h1>
    <div class="frame">
      <div class="fridge" id="fridge" role="application" aria-label="Stern Fridge interior">
        <div class="door-edge" aria-hidden="true"></div>
        <div class="interior">
          <div class="light" aria-hidden="true"></div>
          <div class="shelf top" id="shelf1">
            <div class="item" data-id="coke" tabindex="0"><div class="name">Coke</div><div class="meta">can</div></div>
            <div class="item" data-id="icecream" tabindex="0"><div class="name">Ice Cream</div><div class="meta">tub</div></div>
            <div class="item" data-id="spinach" tabindex="0"><div class="name">Spinach</div><div class="meta">bunch</div></div>
          </div>
          <div class="shelf" id="shelf2">
            <div class="item" data-id="chocolate" tabindex="0"><div class="name">Chocolate</div><div class="meta">bar</div></div>
            <div class="item" data-id="yogurt" tabindex="0"><div class="name">Yogurt</div><div class="meta">pot</div></div>
            <div class="item" data-id="leftovers" tabindex="0"><div class="name">Leftovers</div><div class="meta">tupperware</div></div>
          </div>
        </div>
        <div class="door" id="door">
          <div class="handle" id="handle" role="button" tabindex="0">Open — The Stern Fridge</div>
        </div>
      </div>

      <div class="fridge-wrap">
        <div class="response" id="response">
          <div class="observation" id="obs">Select an item.</div>
          <div class="prediction" id="pred">A quiet record will be kept.</div>
          <div style="width:100%;margin-top:8px;display:flex;gap:8px;align-items:center">
            <input id="free-input" placeholder="Type a food (optional)" style="flex:1;padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:var(--text);outline:none;font-size:13px" />
            <button id="free-btn" style="padding:8px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.04);background:rgba(255,255,255,0.02);color:var(--text);cursor:pointer">Judge</button>
          </div>
        </div>

        <div class="log" id="log">
          <h3>Log</h3>
          <div class="count"><span>Coke</span><span id="coke-count">0</span></div>
          <div class="count"><span>Ice Cream</span><span id="icecream-count">0</span></div>
          <div class="count"><span>Spinach</span><span id="spinach-count">0</span></div>
          <div class="count"><span>Chocolate</span><span id="chocolate-count">0</span></div>
          <div class="count"><span>Yogurt</span><span id="yogurt-count">0</span></div>
          <div class="count"><span>Leftovers</span><span id="leftovers-count">0</span></div>
        </div>
      </div>
    </div>
  </div>

  <div id="cursor" aria-hidden="true"></div>

  <script>
    (function(){
      const itemsEl = Array.from(document.querySelectorAll('.item'));
      const response = document.getElementById('response');
      const obs = document.getElementById('obs');
      const pred = document.getElementById('pred');
      const fridge = document.getElementById('fridge');
      const counts = {coke:0,icecream:0,spinach:0,leftovers:0,chocolate:0,yogurt:0};

      const observations = {
        coke:["Third Coke today.","Another carbonated choice."],
        icecream:["The ice cream is disappearing faster this week.","A cold concession."],
        spinach:["A quiet, disciplined leaf.","Green but neglected."],
        leftovers:["Leftovers hold last week's decisions.","A measured reuse."],
        chocolate:["You seem to prefer sugar over restraint.","A controlled indulgence."],
        yogurt:["Yogurt—constituted moderation.","A tidy, predictable choice."]
      };

      const predictions = {
        coke:["The pattern is becoming easy to predict.","You will notice it again tomorrow."],
        icecream:["It will be gone before dinner.","Spoonfuls will accelerate."],
        spinach:["It may be forgotten until wilted.","A salad might redeem it later."],
        leftovers:["Reheated recollections await.","It will return, unchanged."],
        chocolate:["It will be justified as 'for sharing'.", "Small squares will multiply."],
        yogurt:["It will be consumed with quiet resolve.","A last-minute snack will claim it."]
      };

      const genericObservations = ["An interesting consideration.","A deliberate, quiet thought."];
      const genericPredictions = ["You may return for another snack later tonight.","A similar choice is likely tomorrow."];

      function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}

      function updateCountsUI(){
        Object.keys(counts).forEach(k=>{
          const el = document.getElementById(k+"-count"); if(el) el.textContent = counts[k];
        });
      }

      function clearSelected(){itemsEl.forEach(i=>i.classList.remove('selected'))}

      function handleSelect(el){
        const id = el.dataset.id;
        if(!id) return;
        clearSelected();
        el.classList.add('selected');
        // map key names for counts
        const key = id === 'leftovers' ? 'leftovers' : id;
        counts[key] = (counts[key]||0)+1;
        updateCountsUI();

        // intensify light briefly
        fridge.classList.add('open');
        fridge.classList.add('lit');
        // Keep lit state slightly longer when selecting
        setTimeout(()=>fridge.classList.remove('lit'),900);

        // show observation then prediction
        const o = observations[id] ? pick(observations[id]) : pick(genericObservations);
        const p = predictions[id] ? pick(predictions[id]) : pick(genericPredictions);
        obs.textContent = o;
        pred.textContent = p;
        response.classList.add('visible');
      }

      // Handle door opening via handle
      const handle = document.getElementById('handle');
      handle.addEventListener('click',()=>{fridge.classList.remove('closed');fridge.classList.add('open');});
      handle.addEventListener('keydown',(e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); fridge.classList.remove('closed');fridge.classList.add('open'); }});

      // Free-text judge input
      const freeInput = document.getElementById('free-input');
      const freeBtn = document.getElementById('free-btn');
      function handleFree(){
        const v = (freeInput.value||"").trim();
        if(!v) return;
        fridge.classList.add('open','lit'); setTimeout(()=>fridge.classList.remove('lit'),900);
        obs.textContent = pick([`Thinking of ${v}?`, pick(genericObservations)]);
        pred.textContent = pick(genericPredictions);
        response.classList.add('visible');
        freeInput.value='';
      }
      freeBtn.addEventListener('click',handleFree);
      freeInput.addEventListener('keydown',e=>{ if(e.key==='Enter'){ handleFree(); } });

      itemsEl.forEach(el=>{
        el.addEventListener('click',()=>handleSelect(el));
        el.addEventListener('keydown',(e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); handleSelect(el);} });
      });

      // initial UI
      updateCountsUI();
    })();
  </script>
</body>
</html>

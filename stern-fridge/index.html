<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Stern Fridge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="cursor" id="cursor"></div>

  <header class="site-header">
    <h1>The Stern Fridge</h1>
    <p class="subtitle">A refrigerator that observes your food habits and predicts your behavior.</p>
  </header>

  <main class="main-area">
    <section class="fridge-wrap">
      <div class="fridge" role="application" aria-label="Stern Fridge">
        <div class="shelf shelf-top"></div>
        <div class="shelf shelf-mid"></div>
        <div class="shelf shelf-bottom"></div>

        <div class="items">
          <button class="item" data-item="Coke">Coke</button>
          <button class="item" data-item="Ice Cream">Ice Cream</button>
          <button class="item" data-item="Chocolate">Chocolate</button>
          <button class="item" data-item="Spinach">Spinach</button>
          <button class="item" data-item="Yogurt">Yogurt</button>
          <button class="item" data-item="Leftovers">Leftovers</button>
        </div>
      </div>

      <div class="response-panel" id="response" aria-live="polite">
        <div class="resp-line" id="observation"></div>
        <div class="resp-line" id="prediction"></div>
      </div>

    </section>

    <aside class="log-panel">
      <h2>Behavior Log</h2>
      <ul id="log-list" class="log-list"></ul>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
